name: Build desktop installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows installers
            platform: windows-latest
          - name: Linux packages
            platform: ubuntu-22.04

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify release version
        env:
          GIT_REF_NAME: ${{ github.ref_name }}
          GIT_REF_TYPE: ${{ github.ref_type }}
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $cargoVersion = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value

          if ($packageVersion -ne $tauriVersion -or $packageVersion -ne $cargoVersion) {
            throw "Version mismatch: package.json=$packageVersion, tauri.conf.json=$tauriVersion, Cargo.toml=$cargoVersion"
          }

          if ($env:GIT_REF_TYPE -eq 'tag' -and $env:GIT_REF_NAME -ne "v$packageVersion") {
            throw "Tag $env:GIT_REF_NAME does not match application version v$packageVersion"
          }

      - name: Verify desktop icons
        shell: pwsh
        run: |
          $requiredIcons = @(
            'src-tauri/icons/32x32.png',
            'src-tauri/icons/128x128.png',
            'src-tauri/icons/128x128@2x.png',
            'src-tauri/icons/icon.ico'
          )

          foreach ($icon in $requiredIcons) {
            if (-not (Test-Path -LiteralPath $icon -PathType Leaf)) {
              throw "Required desktop icon is missing: $icon"
            }
          }

          $icoHeader = [System.IO.File]::ReadAllBytes('src-tauri/icons/icon.ico')
          if ($icoHeader.Length -lt 4 -or $icoHeader[0] -ne 0 -or $icoHeader[1] -ne 0 -or $icoHeader[2] -ne 1 -or $icoHeader[3] -ne 0) {
            throw 'src-tauri/icons/icon.ico is not a valid Windows icon file'
          }

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend checks
        run: pnpm check

      - name: Run tests
        run: pnpm test

      - name: Build installers and create release
        uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Moon Dancer v__VERSION__
          releaseBody: |
            Download the installer for your operating system below.

            Windows: use the .exe installer. The .msi package is also available for managed installations.
            Linux: use the .AppImage for a portable launch or the .deb package on Debian and Ubuntu.
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          retryAttempts: 2

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Read release version
        id: release
        shell: bash
        run: echo "tag=v$(node -p \"require('./src-tauri/tauri.conf.json').version\")" >> "$GITHUB_OUTPUT"

      - name: Publish completed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: gh release edit "$RELEASE_TAG" --draft=false --latest

